# Edge URL Shortener, live at go.avenash-kumar.com
# Replace database_id after running: npx wrangler d1 create edge-url-shortener
name = "edge-url-shortener"
main = "src/index.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "go.avenash-kumar.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "edge-url-shortener"
database_id = "57df93b3-005a-4eda-aa6f-d3199f4710ca"
migrations_dir = "migrations"

[vars]
BASE_URL = "https://go.avenash-kumar.com"
